[project]
name = "chemlight"
version = "0.1.0"
description = "chemLight — a lightweight Python chemistry library for balancing equations and elemental data"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["chemistry", "equation", "balancer", "stoichiometry", "periodic-table"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "build>=1.0"]

[project.urls]
Homepage = "https://github.com/mohakmisra8/equation-balancer"
Repository = "https://github.com/mohakmisra8/equation-balancer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
